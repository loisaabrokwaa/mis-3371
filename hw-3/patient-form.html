<!DOCTYPE html>
<!--
    Program name: Lois Abrokwaa
    Date created: 2/24/2026
    Date last edited: 2/24/2026
    Version: 3.0
    Description: Homework 3 - Patient Registration
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Patient Registration | Houston Clinic</title>
    <link rel="stylesheet" href="hw3.css">
</head>
<body>

<!-- ======== HEADER ======== -->
<header>
    <table width="100%" id="header-table">
        <tr>
            <td width="15%" align="center" valign="middle">
                <img src="cliniclogo.png" alt="Houston Clinic Logo" width="68" id="logo"/>
            </td>
            <td valign="middle">
                <h1>Houston Clinic</h1>
                <p class="tagline">New Patient Registration</p>
            </td>
            <td width="20%" align="right" valign="bottom">
                <p class="date-display">Date: <span id="today"></span></p>
            </td>
        </tr>
    </table>
</header>
<div class="header-bar"></div>

<!-- ======== MAIN LAYOUT ======== -->
<div class="page-wrapper">

    <!-- ===== FORM COLUMN ===== -->
    <div class="form-col">
        <form id="regForm" action="thankyou.html" method="get" novalidate>

            <!-- BLOCK 1: Personal Info -->
            <table class="block-table">
                <thead><tr><th colspan="3">
                    <span class="block-num">01</span> Personal Information
                </th></tr></thead>
                <tbody>

                <tr>
                    <td class="lbl-col"><label for="fname">First Name <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="fname" name="fname"
                            maxlength="30" autocomplete="given-name"
                            title="Letters, apostrophes, and dashes only. 1–30 characters. Required."
                            placeholder="Lois"
                            oninput="validateFname()"
                            onblur="validateFname()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="fname-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="mini">Middle Initial</label></td>
                    <td class="inp-col">
                        <input type="text" id="mini" name="mini"
                            maxlength="1" autocomplete="additional-name"
                            title="Optional. One letter only, no numbers."
                            placeholder="A"
                            oninput="validateMini()"
                            onblur="validateMini()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="mini-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="lname">Last Name <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="lname" name="lname"
                            maxlength="30" autocomplete="family-name"
                            title="Letters, apostrophes, and dashes only. 1–30 characters. Required."
                            placeholder="Abrokwaa"
                            oninput="validateLname()"
                            onblur="validateLname()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="lname-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="dob">Date of Birth <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="date" id="dob" name="dob"
                            title="Required. Cannot be a future date or more than 120 years ago."
                            onchange="validateDob()"
                            onblur="validateDob()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="dob-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="ssn">Patient ID # <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="password" id="ssn" name="ssn"
                            maxlength="11"
                            title="9-digit numeric ID. Auto-formatted as XXX-XX-XXXX as you type. Numbers only. Do not use your real SSN."
                            placeholder="XXX-XX-XXXX"
                            oninput="formatSSN(this)"
                            onblur="validateSSN()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="ssn-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="pgender">Gender</label></td>
                    <td class="inp-col" colspan="2">
                        <label class="radio-lbl"><input type="radio" name="pgender" value="Male"
                            title="Select Male"> Male</label>
                        <label class="radio-lbl"><input type="radio" name="pgender" value="Female"
                            title="Select Female"> Female</label>
                        <label class="radio-lbl"><input type="radio" name="pgender" value="Other"
                            title="Select Other / prefer not to say"> Other</label>
                    </td>
                </tr>

                </tbody>
            </table>

            <!-- BLOCK 2: Contact Info -->
            <table class="block-table">
                <thead><tr><th colspan="3">
                    <span class="block-num">02</span> Contact Information
                </th></tr></thead>
                <tbody>

                <tr>
                    <td class="lbl-col"><label for="email">Email <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="email" name="email"
                            maxlength="80" autocomplete="email"
                            title="Required. Format: name@domain.tld. Will be converted to lowercase."
                            placeholder="lois@gmail.com"
                            oninput="validateEmail()"
                            onblur="forceEmailLower(); validateEmail()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="email-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="phone">Phone <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="phone" name="phone"
                            maxlength="12"
                            title="Required. Format: 000-000-0000"
                            placeholder="713-000-0000"
                            oninput="validatePhone()"
                            onblur="validatePhone()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="phone-err"></span></td>
                </tr>

                </tbody>
            </table>

            <!-- BLOCK 3: Address -->
            <table class="block-table">
                <thead><tr><th colspan="3">
                    <span class="block-num">03</span> Address
                </th></tr></thead>
                <tbody>

                <tr>
                    <td class="lbl-col"><label for="addr1">Address Line 1 <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="addr1" name="addr1"
                            maxlength="60"
                            title="Required. Street address, 2–60 characters."
                            placeholder="4971 Martin Luther King Blvd"
                            oninput="validateAddr1()"
                            onblur="validateAddr1()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="addr1-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="addr2">Address Line 2</label></td>
                    <td class="inp-col">
                        <input type="text" id="addr2" name="addr2"
                            maxlength="60"
                            title="Optional. Apartment, suite, etc. If entered, must be 2–60 characters."
                            placeholder="Apt C"
                            oninput="validateAddr2()"
                            onblur="validateAddr2()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="addr2-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="city">City <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="city" name="city"
                            maxlength="30"
                            title="Required. 2–30 characters."
                            placeholder="Houston"
                            oninput="validateCity()"
                            onblur="validateCity()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="city-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="state">State <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <select id="state" name="state"
                            title="Required. Select your state from the list."
                            onchange="validateState()"
                            onblur="validateState()">
                            <option value="">-- Select State --</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="DC">District of Columbia</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="GU">Guam</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="PR">Puerto Rico</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </td>
                    <td class="err-col"><span class="errmsg" id="state-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="zip">Zip Code <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="zip" name="zip"
                            maxlength="5"
                            title="Required. 5 digits only."
                            placeholder="77002"
                            oninput="validateZip()"
                            onblur="validateZip()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="zip-err"></span></td>
                </tr>

                </tbody>
            </table>

            <!-- BLOCK 4: Medical History -->
            <table class="block-table">
                <thead><tr><th colspan="3">
                    <span class="block-num">04</span> Medical History &amp; Preferences
                </th></tr></thead>
                <tbody>

                <tr>
                    <td colspan="3" class="lbl-pad">
                        <strong>Check all conditions you have had:</strong>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" class="checkbox-cell">
                        <label class="chk-lbl"><input type="checkbox" name="history" value="Chicken Pox"
                            title="Check if you have had Chicken Pox"> Chicken Pox</label>
                        <label class="chk-lbl"><input type="checkbox" name="history" value="Flu"
                            title="Check if you have had the Flu"> Flu</label>
                        <label class="chk-lbl"><input type="checkbox" name="history" value="COVID-19"
                            title="Check if you have had COVID-19"> COVID-19</label>
                        <label class="chk-lbl"><input type="checkbox" name="history" value="Measles"
                            title="Check if you have had Measles"> Measles</label>
                        <label class="chk-lbl"><input type="checkbox" name="history" value="Mumps"
                            title="Check if you have had Mumps"> Mumps</label>
                        <label class="chk-lbl"><input type="checkbox" name="history" value="Heart Disease"
                            title="Check if you have or have had Heart Disease"> Heart Disease</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="3" class="lbl-pad">
                        <strong>Vaccination status:</strong>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" class="radio-cell">
                        <label class="radio-lbl"><input type="radio" name="vaccinated" value="Yes"
                            title="I have been vaccinated"> Yes — Vaccinated</label>
                        <label class="radio-lbl"><input type="radio" name="vaccinated" value="No"
                            title="I have not been vaccinated"> No — Not Vaccinated</label>
                        <label class="radio-lbl"><input type="radio" name="vaccinated" value="Unsure"
                            title="I am unsure of my vaccination status"> Unsure</label>
                    </td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="painlevel">Pain / Health Level</label></td>
                    <td class="inp-col" colspan="2">
                        <div class="slider-wrap">
                            <input type="range" id="painlevel" name="painlevel"
                                min="1" max="10" value="5"
                                title="Slide to indicate your current pain or health level. 1 = No pain / Excellent, 10 = Severe."
                                oninput="updateSlider(this.value)">
                            <span id="slider-display" class="slider-badge">5 – Moderate</span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="notes">Additional Notes</label></td>
                    <td class="inp-col" colspan="2">
                        <textarea id="notes" name="notes" rows="3" cols="38"
                            title="Optional. Describe any additional symptoms or concerns. Avoid using double-quote characters."
                            placeholder="Describe any symptoms, concerns, or additional medical history..."></textarea>
                    </td>
                </tr>

                </tbody>
            </table>

            <!-- BLOCK 5: Account Setup -->
            <table class="block-table">
                <thead><tr><th colspan="3">
                    <span class="block-num">05</span> Account Setup
                </th></tr></thead>
                <tbody>

                <tr>
                    <td class="lbl-col"><label for="uid">User ID <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="text" id="uid" name="uid"
                            maxlength="20"
                            title="Required. 5–20 characters. Must start with a letter. Letters, numbers, dash, and underscore only. No spaces."
                            placeholder="lois_a"
                            oninput="validateUID()"
                            onblur="forceUIDLower(); validateUID()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="uid-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="pword">Password <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="password" id="pword" name="pword"
                            maxlength="30"
                            title="Required. 8–30 characters. Must include at least 1 uppercase letter, 1 lowercase letter, and 1 digit. Cannot equal your User ID."
                            oninput="validatePword()"
                            onblur="validatePword()">
                        <div class="hint-box" id="pword-hints">
                            <span id="hint-len"></span>
                            <span id="hint-upper"></span>
                            <span id="hint-lower"></span>
                            <span id="hint-digit"></span>
                            <span id="hint-uid"></span>
                        </div>
                    </td>
                    <td class="err-col"><span class="errmsg" id="pword-err"></span></td>
                </tr>

                <tr>
                    <td class="lbl-col"><label for="pword2">Confirm Password <span class="req">*</span></label></td>
                    <td class="inp-col">
                        <input type="password" id="pword2" name="pword2"
                            maxlength="30"
                            title="Required. Re-enter your password exactly as typed above."
                            oninput="confirmPword()"
                            onblur="confirmPword()">
                    </td>
                    <td class="err-col"><span class="errmsg" id="pword2-err"></span></td>
                </tr>

                <!-- BUTTONS ROW -->
                <tr>
                    <td colspan="3" class="btn-row">
                        <button type="button" id="reviewBtn" onclick="reviewInput()">&#128269; Review</button>
                        <button type="button" id="validateBtn" onclick="validateAll()">&#10003; Validate</button>
                        <!-- Submit only appears when all fields are valid -->
                        <button type="submit" id="submitBtn" style="display:none;">&#10148; Submit</button>
                        <button type="reset" id="resetBtn" onclick="clearAll()">&#8635; Start Over</button>
                    </td>
                </tr>

                </tbody>
            </table>

        </form>
    </div><!-- end form-col -->

    <!-- ===== REVIEW / VALIDATION COLUMN ===== -->
    <div class="review-col" id="reviewPanel" style="display:none;">
        <h3 id="review-title">&#128203; Review Information</h3>
        <table class="review-tbl" id="reviewTable"></table>
        <p class="review-note" id="review-note"></p>
    </div>

</div><!-- end page-wrapper -->

<script src="hw3.js"></script>
</body>
</html>
